<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Жилые комплексы — КВАДРАТ</title>
  <meta name="description" content="Выберите жилой комплекс Ростова-на-Дону: ССК, СК10, ДОННЕФТЕСТРОЙ. Реальные ЖК и фото с сайтов застройщиков.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div id="crumbs"></div>
        <h1 class="page-hero__title">Выберите жилой комплекс</h1>
        <p class="page-hero__sub">
          Реальные новостройки Ростова-на-Дону. Нажмите на ЖК, чтобы перейти к нему
          и рассчитать мебель и ремонт для вашей квартиры.
        </p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container" id="cx-picker"></div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/estimate.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    window.PAGE_KEY = 'complexes';

    document.addEventListener('DOMContentLoaded', () => {
      const catalog = Store.getCatalog();
      const cityId = Store.getCityId();

      document.getElementById('crumbs').innerHTML = UI.breadcrumbs([
        { label: 'Главная', href: 'index.html' },
        { label: 'Жилые комплексы' },
      ]);

      const all = catalog.complexes.filter((c) => c.published && c.cityId === cityId);
      const featured = all.filter((c) => c.priority);
      const rest = all.filter((c) => !c.priority);
      const picker = document.getElementById('cx-picker');
      const devOf = (c) => catalog.developers.find((d) => d.id === c.developerId);

      let html = '';
      if (featured.length) {
        html += '<div class="cx-group">' + featured.map((c) => UI.complexTile(c, devOf(c), { featured: true })).join('') + '</div>';
      }

      /* Остальные ЖК — группами по застройщикам */
      catalog.developers
        .filter((d) => d.published && d.cityId === cityId)
        .forEach((dev) => {
          const list = rest.filter((c) => c.developerId === dev.id);
          if (!list.length) return;
          html += `
            <div class="cx-group">
              <div class="cx-group__head">
                <h2 class="cx-group__title">${UI.escapeHtml(dev.name)}</h2>
                <span class="cx-group__count">${list.length} ЖК</span>
              </div>
              <div class="cx-grid">${list.map((c) => UI.complexTile(c, dev)).join('')}</div>
            </div>`;
        });

      if (!html) {
        html = UI.emptyState('Каталог пуст', 'Для выбранного города пока нет опубликованных жилых комплексов.');
      } else {
        html += '<p class="source-note" style="margin-top:var(--space-9)">Фотографии и сведения взяты с официальных сайтов застройщиков и могут отличаться от актуальных. Наличие квартир, цены и сроки уточняйте у застройщика.</p>';
      }
      picker.innerHTML = html;

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fav]');
        if (!btn) return;
        e.preventDefault();
        const added = Store.toggleFavorite(btn.dataset.fav, btn.dataset.id);
        btn.classList.toggle('is-active', added);
        UI.updateFavoritesBadge();
        UI.toast(added ? 'Добавлено в избранное' : 'Удалено из избранного');
      });
    });
  </script>
</body>
</html>
