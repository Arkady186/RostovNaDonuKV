<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Застройщик — КВАДРАТ</title>
  <meta name="description" content="Страница застройщика: описание и жилые комплексы.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div id="crumbs"></div>
        <div id="developer-head"></div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="section__head">
          <div>
            <div class="section__eyebrow">Жилые комплексы</div>
            <h2 class="section__title" id="dev-complexes-title"></h2>
          </div>
        </div>
        <div class="grid grid--auto" id="dev-complexes"></div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/estimate.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    window.PAGE_KEY = 'developer';

    document.addEventListener('DOMContentLoaded', () => {
      const catalog = Store.getCatalog();
      const slug = UI.getParam('slug');
      const dev = catalog.developers.find((d) => d.slug === slug && d.published);

      if (!dev) {
        document.getElementById('developer-head').innerHTML =
          '<h1 class="page-hero__title">Застройщик не найден</h1>' +
          '<p class="page-hero__sub">Возможно, запись была скрыта или удалена.</p>';
        document.getElementById('dev-complexes').innerHTML =
          UI.emptyState('Ничего не найдено', 'Вернитесь в каталог застройщиков.', '<a class="btn btn--primary" href="developers.html">К каталогу</a>');
        return;
      }

      const city = catalog.cities.find((c) => c.id === dev.cityId);
      const complexes = catalog.complexes.filter((c) => c.developerId === dev.id && c.published);

      document.getElementById('crumbs').innerHTML = UI.breadcrumbs([
        { label: 'Главная', href: 'index.html' },
        { label: 'Застройщики', href: 'developers.html' },
        { label: dev.name },
      ]);

      document.getElementById('developer-head').innerHTML = `
        <div style="display:flex;align-items:center;gap:var(--space-5);margin-top:var(--space-5);flex-wrap:wrap">
          <div style="width:72px;height:72px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:1.3rem;flex-shrink:0">
            ${UI.escapeHtml(dev.logoText || dev.name.slice(0, 3).toUpperCase())}
          </div>
          <div>
            <h1 class="page-hero__title" style="margin-top:0">${UI.escapeHtml(dev.name)}</h1>
            <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;margin-top:var(--space-3)">
              <span class="badge badge--sand">${UI.escapeHtml(city ? city.name : '')}</span>
              <span class="badge badge--outline">${complexes.length} ЖК в каталоге</span>
            </div>
          </div>
        </div>
        <p class="page-hero__sub">${UI.escapeHtml(dev.description)}</p>
        ${dev.sourceUrl ? `<p class="source-note"><a href="${dev.sourceUrl}" target="_blank" rel="noopener noreferrer">Официальный сайт застройщика ↗</a></p>` : ''}`;

      document.getElementById('dev-complexes-title').textContent =
        complexes.length ? `Комплексы застройщика ${dev.name}` : 'Комплексы пока не добавлены';

      document.getElementById('dev-complexes').innerHTML = complexes
        .map((c) => {
          const apts = catalog.apartments.filter((a) => a.complexId === c.id && a.published);
          return `
          <article class="card card--link">
            <div class="card__media">
              <img class="card__img" src="${c.image}" alt="${UI.escapeHtml(c.name)}" loading="lazy">
                <span class="photo-credit">${c.imageKind === 'official' ? 'Материал с сайта застройщика' : 'Иллюстрация, не фото ЖК'}</span>
              ${c.demo ? '<span class="badge badge--demo card__media-badge">Демо-данные</span>' : ''}
              <button class="card__fav ${Store.isFavorite('complexes', c.id) ? 'is-active' : ''}" data-fav="complexes" data-id="${c.id}" aria-label="В избранное">♡</button>
            </div>
            <div class="card__body">
              <h2 class="card__title"><a href="complex.html?slug=${c.slug}">${UI.escapeHtml(c.name)}</a></h2>
              <div class="card__meta">
                ${c.class ? `<span class="tag">${UI.escapeHtml(c.class)}</span>` : ''}
                <span class="tag">${apts.length} проверенных планировок</span>
              </div>
              <p class="card__text">${UI.escapeHtml(c.description.slice(0, 110))}…</p>
              <div class="card__footer">
                <a class="btn btn--primary btn--sm" href="${apts.length ? `apartments.html?complex=${c.slug}` : (c.sourceUrl || `complex.html?slug=${c.slug}`)}" ${apts.length ? '' : 'target="_blank" rel="noopener noreferrer"'}>${apts.length ? 'Выбрать квартиру' : 'Проверить у застройщика ↗'}</a>
              </div>
            </div>
          </article>`;
        })
        .join('');

      if (!complexes.length) {
        document.getElementById('dev-complexes').innerHTML = UI.emptyState(
          'Комплексы пока не добавлены',
          'Записи появятся в каталоге после публикации в административной панели.'
        );
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fav]');
        if (!btn) return;
        const added = Store.toggleFavorite(btn.dataset.fav, btn.dataset.id);
        btn.classList.toggle('is-active', added);
        UI.updateFavoritesBadge();
        UI.toast(added ? 'Добавлено в избранное' : 'Удалено из избранного');
      });
    });
  </script>
</body>
</html>
