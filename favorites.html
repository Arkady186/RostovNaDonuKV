<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Избранное — КВАДРАТ</title>
  <meta name="description" content="Сохранённые жилые комплексы, квартиры и дизайн-проекты.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div id="crumbs"></div>
        <h1 class="page-hero__title">Избранное</h1>
        <p class="page-hero__sub">
          Жилые комплексы, квартиры и дизайн-проекты, которые вы сохранили.
          Список хранится в вашем браузере и переживает обновление страницы.
        </p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="chips" style="margin-bottom:var(--space-6)" id="fav-tabs"></div>
        <div id="fav-content"></div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/estimate.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    window.PAGE_KEY = 'favorites';

    document.addEventListener('DOMContentLoaded', () => {
      const catalog = Store.getCatalog();

      document.getElementById('crumbs').innerHTML = UI.breadcrumbs([
        { label: 'Главная', href: 'index.html' },
        { label: 'Избранное' },
      ]);

      const tabs = [
        { key: 'complexes', label: 'Жилые комплексы' },
        { key: 'apartments', label: 'Квартиры' },
        { key: 'designs', label: 'Дизайн-проекты' },
      ];

      const tabsEl = document.getElementById('fav-tabs');
      const contentEl = document.getElementById('fav-content');
      let activeTab = 'complexes';

      function renderTabs() {
        tabsEl.innerHTML = tabs
          .map((t) => {
            const count = Store.getFavorites()[t.key].length;
            return `<button class="chip ${t.key === activeTab ? 'is-active' : ''}" data-tab="${t.key}">${t.label} · ${count}</button>`;
          })
          .join('');
        UI.qsa('.chip', tabsEl).forEach((c) =>
          c.addEventListener('click', () => {
            activeTab = c.dataset.tab;
            renderTabs();
            renderContent();
          })
        );
      }

      function renderContent() {
        const fav = Store.getFavorites();
        const ids = fav[activeTab];

        if (!ids.length) {
          contentEl.innerHTML = UI.emptyState(
            'Пока пусто',
            'Сохраняйте жилые комплексы, квартиры и дизайн-проекты — они появятся здесь.',
            '<a class="btn btn--primary" href="complexes.html">Открыть каталог</a>'
          );
          return;
        }

        let cards = '';

        if (activeTab === 'complexes') {
          cards = ids
            .map((id) => {
              const c = catalog.complexes.find((x) => x.id === id);
              if (!c) return '';
              const dev = catalog.developers.find((d) => d.id === c.developerId);
              return `
              <article class="card">
                <div class="card__media">
                  <img class="card__img" src="${c.image}" alt="${UI.escapeHtml(c.name)}" loading="lazy">
                <span class="photo-credit">${c.imageKind === 'official' ? 'Материал с сайта застройщика' : 'Иллюстрация, не фото ЖК'}</span>
                  ${c.demo ? '<span class="badge badge--demo card__media-badge">Демо-данные</span>' : ''}
                </div>
                <div class="card__body">
                  <h2 class="card__title"><a href="complex.html?slug=${c.slug}">${UI.escapeHtml(c.name)}</a></h2>
                  <div class="card__meta">
                    <span class="tag">${UI.escapeHtml(dev ? dev.name : '')}</span>
                    <span class="tag">${UI.escapeHtml(c.class)}</span>
                  </div>
                  <div class="card__footer">
                    <a class="btn btn--primary btn--sm" href="apartments.html?complex=${c.slug}">Выбрать квартиру</a>
                    <button class="btn btn--danger btn--sm" data-remove="complexes" data-id="${c.id}">Удалить</button>
                  </div>
                </div>
              </article>`;
            })
            .join('');
        }

        if (activeTab === 'apartments') {
          cards = ids
            .map((id) => {
              const a = catalog.apartments.find((x) => x.id === id);
              if (!a) return '';
              const c = catalog.complexes.find((x) => x.id === a.complexId);
              const info = APARTMENT_TYPES[a.type];
              return `
              <article class="card">
                <div class="card__body">
                  <div class="card__meta">
                    <span class="badge badge--sand">${info.label}</span>
                    <span class="tag">${a.area} м²</span>
                    <span class="tag">${UI.escapeHtml(c ? c.name : '')}</span>
                  </div>
                  <h2 class="card__title"><a href="apartment.html?complex=${c ? c.slug : ''}&id=${a.id}">${info.label} · ${a.area} м²</a></h2>
                  <p class="card__text">${UI.escapeHtml(a.description)}</p>
                  <div class="card__footer">
                    <a class="btn btn--primary btn--sm" href="configurator.html?complex=${c ? c.slug : ''}&apartment=${a.id}">Подобрать дизайн</a>
                    <button class="btn btn--danger btn--sm" data-remove="apartments" data-id="${a.id}">Удалить</button>
                  </div>
                </div>
              </article>`;
            })
            .join('');
        }

        if (activeTab === 'designs') {
          cards = ids
            .map((id) => {
              const d = catalog.designs.find((x) => x.id === id);
              if (!d) return '';
              return `
              <article class="card">
                <div class="card__media">
                  <img class="card__img" src="${d.image}" alt="${UI.escapeHtml(d.name)}" loading="lazy">
                </div>
                <div class="card__body">
                  <h2 class="card__title"><a href="design.html?slug=${d.slug}">${UI.escapeHtml(d.name)}</a></h2>
                  <div class="card__meta">
                    <span class="tag">${UI.escapeHtml(d.style)}</span>
                    <span class="tag">${UI.escapeHtml(d.priceLevel)}</span>
                  </div>
                  <div class="card__footer">
                    <a class="btn btn--primary btn--sm" href="configurator.html?design=${d.slug}">Выбрать этот дизайн</a>
                    <button class="btn btn--danger btn--sm" data-remove="designs" data-id="${d.id}">Удалить</button>
                  </div>
                </div>
              </article>`;
            })
            .join('');
        }

        contentEl.innerHTML = `<div class="grid grid--auto">${cards}</div>`;

        UI.qsa('[data-remove]', contentEl).forEach((btn) => {
          btn.addEventListener('click', async () => {
            const ok = await UI.confirmDialog('Удалить из избранного?');
            if (!ok) return;
            Store.toggleFavorite(btn.dataset.remove, btn.dataset.id);
            UI.updateFavoritesBadge();
            renderTabs();
            renderContent();
            UI.toast('Удалено из избранного');
          });
        });
      }

      renderTabs();
      renderContent();
    });
  </script>
</body>
</html>
