<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заявка — КВАДРАТ</title>
  <meta name="description" content="Оформление заявки на ремонт: резюме выбора и контактные данные.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div id="app-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div id="crumbs"></div>
        <h1 class="page-hero__title">Заявка на ремонт</h1>
        <p class="page-hero__sub">
          Проверьте резюме выбранного ремонта и отправьте заявку — менеджер свяжется с вами
          по указанному номеру телефона.
        </p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div id="request-root"></div>
      </div>
    </section>
  </main>

  <div id="app-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/estimate.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    window.PAGE_KEY = 'request';

    document.addEventListener('DOMContentLoaded', () => {
      const catalog = Store.getCatalog();
      const config = Store.getConfig();
      const est = Estimate.calculate(config);

      document.getElementById('crumbs').innerHTML = UI.breadcrumbs([
        { label: 'Главная', href: 'index.html' },
        { label: 'Заявка' },
      ]);

      const root = document.getElementById('request-root');

      function needLogin() {
        root.innerHTML = UI.emptyState(
          'Войдите, чтобы отправить заявку',
          'Так мы сохраним вашу конфигурацию и сможем связаться с вами по номеру телефона.',
          '<a class="btn btn--primary" href="login.html?next=request.html">Войти</a> <a class="btn btn--secondary" href="login.html?next=request.html#register">Регистрация</a>'
        );
      }
      if (typeof Auth !== 'undefined' && !Auth.isLoggedIn()) {
        needLogin();
        document.addEventListener('auth:ready', () => { if (Auth.isLoggedIn()) location.reload(); });
        return;
      }

      if (!est) {
        root.innerHTML = UI.emptyState(
          'Сначала соберите конфигурацию',
          'Заявка формируется на основе выбранной квартиры, дизайна и комплектации.',
          '<a class="btn btn--primary" href="configurator.html">Открыть конфигуратор</a>'
        );
        return;
      }

      const complex = catalog.complexes.find((c) => c.id === config.complexId);
      const design = catalog.designs.find((d) => d.id === config.designId);

      root.innerHTML = `
        <div class="grid grid--2" style="align-items:start;gap:var(--space-7)">
          <div>
            <div class="section__eyebrow">Резюме выбора</div>
            <div class="summary-list" style="margin-bottom:var(--space-6)">
              <div class="summary-list__row"><span>Жилой комплекс</span><span>${UI.escapeHtml(complex ? complex.name : '—')}</span></div>
              <div class="summary-list__row"><span>Квартира / площадь</span><span>${config.apartmentId === 'custom-area' ? `Расчёт по площади · ${est.apartment.area} м² (без плана)` : `${APARTMENT_TYPES[est.apartment.type].label} · ${est.apartment.area} м²`}</span></div>
              <div class="summary-list__row"><span>Дизайн-проект</span><span>${UI.escapeHtml(design ? design.name : '—')}</span></div>
              <div class="summary-list__row"><span>Комплектация</span><span>${UI.escapeHtml(est.pkg.name)}</span></div>
              <div class="summary-list__row"><span>Предварительная стоимость</span><span>${UI.formatMoney(est.total)}</span></div>
              <div class="summary-list__row"><span>Ориентировочный срок</span><span>${est.durationText}</span></div>
            </div>
            <div class="notice">
              <span class="notice__mark">i</span>
              <span>Расчёт предварительный и не является офертой. Расчёт по введённой площади не подтверждает наличие конкретной квартиры.</span>
            </div>
          </div>

          <div>
            <form id="request-form" novalidate>
              <div class="field" style="margin-bottom:var(--space-5)">
                <label class="field__label" for="req-name">Имя *</label>
                <input class="input" id="req-name" name="name" type="text" autocomplete="name" placeholder="Как к вам обращаться">
                <span class="field__error">Укажите имя (минимум 2 символа)</span>
              </div>
              <div class="field" style="margin-bottom:var(--space-5)">
                <label class="field__label" for="req-phone">Телефон *</label>
                <input class="input" id="req-phone" name="phone" type="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__">
                <span class="field__error">Укажите корректный номер телефона</span>
              </div>
              <div class="field" style="margin-bottom:var(--space-5)">
                <label class="field__label" for="req-email">Электронная почта</label>
                <input class="input" id="req-email" name="email" type="email" autocomplete="email" placeholder="Необязательно">
                <span class="field__error">Укажите корректный e-mail</span>
              </div>
              <div class="field" style="margin-bottom:var(--space-5)">
                <label class="field__label" for="req-comment">Комментарий</label>
                <textarea class="textarea" id="req-comment" name="comment" placeholder="Необязательно: пожелания, сроки, вопросы"></textarea>
              </div>
              <label class="checkbox" style="margin-bottom:var(--space-6)">
                <input type="checkbox" id="req-consent">
                <span>Я согласен на обработку персональных данных в соответствии с <a href="privacy.html" target="_blank" rel="noopener">Политикой обработки персональных данных</a> *</span>
              </label>
              <div class="field has-error" id="consent-error" style="margin-bottom:var(--space-5)">
                <span class="field__error">Необходимо согласие на обработку данных</span>
              </div>
              <button class="btn btn--primary btn--lg btn--block" type="submit">Отправить заявку</button>
            </form>
          </div>
        </div>`;

      const form = document.getElementById('request-form');
      const nameEl = document.getElementById('req-name');
      const phoneEl = document.getElementById('req-phone');
      const emailEl = document.getElementById('req-email');
      const consentEl = document.getElementById('req-consent');
      const consentError = document.getElementById('consent-error');

      function setError(el, has) {
        const field = el.closest('.field');
        field.classList.toggle('has-error', has);
        el.classList.toggle('is-invalid', has);
      }

      function validate() {
        let ok = true;

        const nameOk = nameEl.value.trim().length >= 2;
        setError(nameEl, !nameOk);
        if (!nameOk) ok = false;

        const phoneOk = /^[+\d][\d\s()-]{9,17}$/.test(phoneEl.value.trim());
        setError(phoneEl, !phoneOk);
        if (!phoneOk) ok = false;

        const emailVal = emailEl.value.trim();
        const emailOk = !emailVal || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(emailVal);
        setError(emailEl, !emailOk);
        if (!emailOk) ok = false;

        const consentOk = consentEl.checked;
        consentError.classList.toggle('has-error', !consentOk);
        if (!consentOk) ok = false;

        return ok;
      }

      const me = (typeof Auth !== 'undefined' && Auth.current()) || {};
      if (me.name) nameEl.value = me.name;
      if (me.phone) phoneEl.value = me.phone;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validate()) {
          UI.toast('Проверьте правильность заполнения формы');
          return;
        }

        const request = {
          name: nameEl.value.trim(),
          phone: phoneEl.value.trim(),
          email: emailEl.value.trim(),
          comment: document.getElementById('req-comment').value.trim(),
          complex: complex ? complex.name : '',
          design: design ? design.name : '',
          pkg: est.pkg.name,
          area: est.apartment.area,
          total: est.total,
        };
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        try {
          await Auth.sendRequest(request);
        } catch (err) {
          btn.disabled = false;
          if (err.status === 401) { needLogin(); return; }
          UI.toast(err.message || 'Не удалось отправить заявку');
          return;
        }

        root.innerHTML = `
          <div class="empty-state" style="max-width:560px;margin:0 auto">
            <div class="empty-state__icon" aria-hidden="true">✓</div>
            <div class="empty-state__title">Спасибо! Заявка отправлена</div>
            <p class="empty-state__text">
              Менеджер увидит вашу заявку и свяжется с вами по номеру телефона. Ваши данные
              остаются у нас и не передаются третьим лицам.
            </p>
            <div style="display:flex;gap:var(--space-3);justify-content:center;flex-wrap:wrap">
              <a class="btn btn--primary" href="estimate.html">Вернуться к смете</a>
              <a class="btn btn--secondary" href="index.html">На главную</a>
            </div>
          </div>`;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      /* Живая валидация при вводе */
      [nameEl, phoneEl, emailEl].forEach((el) => {
        el.addEventListener('input', () => {
          const field = el.closest('.field');
          if (field.classList.contains('has-error')) {
            setError(el, false);
          }
        });
      });
      consentEl.addEventListener('change', () => consentError.classList.remove('has-error'));
    });
  </script>
</body>
</html>
